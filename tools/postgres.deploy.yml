apiVersion: template.openshift.io/v1
kind: Template
labels:
  app: ${NAME}-${ZONE}
  app.kubernetes.io/part-of: ${NAME}-${ZONE}
parameters:
  - name: NAME
    description: Product name
    value: nr-waste-plus
  - name: ZONE
    description: Deployment zone, scoped per PR, e.g. pr1446
    required: true
  - name: POSTGRES_HOST
    description: Host of the per-PR PostgreSQL instance
    required: true
  - name: POSTGRES_PORT
    description: Port of the per-PR PostgreSQL instance
    required: true
    value: "5432"
  - name: POSTGRES_SERVER_SECRET
    description: Secret holding database-name, database-user and database-password
    required: true
  - name: POSTGRES_SCHEMA
    description: Schema managed by Flyway
    value: hrs
objects:
  - kind: CronJob
    apiVersion: batch/v1
    metadata:
      name: ${NAME}-${ZONE}-droppg
      labels:
        app: ${NAME}-${ZONE}
        cronjob: ${NAME}-${ZONE}
    spec:
      schedule: "0 0 31 2 *"
      concurrencyPolicy: "Replace"
      jobTemplate:
        metadata:
          labels:
            app: ${NAME}-${ZONE}
            cronjob: ${NAME}-${ZONE}
        spec:
          template:
            metadata:
              labels:
                app: ${NAME}-${ZONE}
                cronjob: ${NAME}-${ZONE}
            spec:
              containers:
                - name: drop-pr-database
                  image: postgres:17.11-alpine
                  command: ["/bin/sh", "-c"]
                  args:
                    - |
                      set -eu

                      : "${PGDATABASE:?database-name is required}"
                      echo "Dropping the PostgreSQL database ${PGDATABASE}"

                      # FORCE terminates sessions left behind by a previous
                      # backend pod, so a redeploy cannot fail on a held
                      # connection. The maintenance database always exists.
                      # The statement is fed on stdin because psql does not
                      # interpolate :"var" inside -c commands.
                      psql --dbname=postgres --set=ON_ERROR_STOP=1 --quiet \
                        --set=db="${PGDATABASE}" <<'SQL'
                      DROP DATABASE IF EXISTS :"db" WITH (FORCE);
                      SQL

                      echo "Dropped the PostgreSQL database ${PGDATABASE}"
                  env:
                    - name: PGHOST
                      value: ${POSTGRES_HOST}
                    - name: PGPORT
                      value: ${POSTGRES_PORT}
                    - name: PGUSER
                      valueFrom:
                        secretKeyRef:
                          name: ${POSTGRES_SERVER_SECRET}
                          key: database-user
                    - name: PGPASSWORD
                      valueFrom:
                        secretKeyRef:
                          name: ${POSTGRES_SERVER_SECRET}
                          key: database-password
                    - name: PGDATABASE
                      valueFrom:
                        secretKeyRef:
                          name: ${POSTGRES_SERVER_SECRET}
                          key: database-name
              restartPolicy: OnFailure
  - kind: CronJob
    apiVersion: batch/v1
    metadata:
      name: ${NAME}-${ZONE}-migratepg
      labels:
        app: ${NAME}-${ZONE}
        cronjob: ${NAME}-${ZONE}
    spec:
      schedule: "0 0 31 2 *"
      concurrencyPolicy: "Replace"
      jobTemplate:
        metadata:
          labels:
            app: ${NAME}-${ZONE}
            cronjob: ${NAME}-${ZONE}
        spec:
          template:
            metadata:
              labels:
                app: ${NAME}-${ZONE}
                cronjob: ${NAME}-${ZONE}
            spec:
              initContainers:
                - name: create-pr-database
                  image: postgres:17.11-alpine
                  command: ["/bin/sh", "-c"]
                  args:
                    - |
                      set -eu

                      : "${PGDATABASE:?database-name is required}"

                      exists=$(psql --dbname=postgres -tAc \
                        "SELECT 1 FROM pg_database WHERE datname = '${PGDATABASE}'")
                      if [ "${exists}" = "1" ]; then
                        echo "Database ${PGDATABASE} already exists."
                        exit 0
                      fi

                      echo "Creating the PostgreSQL database ${PGDATABASE}"
                      psql --dbname=postgres --set=ON_ERROR_STOP=1 --quiet \
                        --set=db="${PGDATABASE}" \
                        --set=owner="${PGUSER}" <<'SQL'
                      CREATE DATABASE :"db" OWNER :"owner";
                      SQL
                      echo "Created the PostgreSQL database ${PGDATABASE}"
                  env:
                    - name: PGHOST
                      value: ${POSTGRES_HOST}
                    - name: PGPORT
                      value: ${POSTGRES_PORT}
                    - name: PGUSER
                      valueFrom:
                        secretKeyRef:
                          name: ${POSTGRES_SERVER_SECRET}
                          key: database-user
                    - name: PGPASSWORD
                      valueFrom:
                        secretKeyRef:
                          name: ${POSTGRES_SERVER_SECRET}
                          key: database-password
                    - name: PGDATABASE
                      valueFrom:
                        secretKeyRef:
                          name: ${POSTGRES_SERVER_SECRET}
                          key: database-name
                - name: curl-container
                  image: curlimages/curl
                  command: ["/bin/sh", "-c"]
                  args:
                    - |
                      set -eu

                      echo "Downloading zip file from GitHub repository bcgov/nr-waste-plus branch ${BRANCH_NAME}"
                      curl -fL "https://github.com/bcgov/nr-waste-plus/archive/refs/heads/${BRANCH_NAME}.zip" -o /data/nr-waste-plus.zip

                      unzip -q /data/nr-waste-plus.zip -d /data

                      MIGRATION_DIR_MAIN=$(find "/data" -type d -path "*/backend/src/main/resources/db/migration" -print -quit)
                      if [ -z "${MIGRATION_DIR_MAIN}" ]; then
                        echo "Migration directory not found!" >&2
                        exit 1
                      fi

                      mkdir -p "/data/sql"
                      cp "${MIGRATION_DIR_MAIN}"/* "/data/sql"

                      # The seeded test data is optional: it only exists while a
                      # branch carries it. Copying it when present keeps the PR
                      # environment populated, and skipping it when absent keeps
                      # the migration from failing on a branch that dropped it.
                      MIGRATION_DIR_TEST=$(find "/data" -type d -path "*/backend/src/test/resources/db/migration" -print -quit)
                      if [ -n "${MIGRATION_DIR_TEST}" ]; then
                        cp "${MIGRATION_DIR_TEST}"/* "/data/sql" 2>/dev/null || true
                      fi

                      rm -rf /data/nr-waste-plus*
                      echo "Migration files moved to /data/sql:"
                      ls -1 /data/sql
                  env:
                    - name: BRANCH_NAME
                      value: "main"
                  volumeMounts:
                    - name: data-volume
                      mountPath: /data
              containers:
                - name: flyway
                  image: flyway/flyway
                  command: ["/bin/sh", "-c"]
                  args:
                    - |
                      set -eu

                      : "${FLYWAY_DATABASE:?database-name is required}"
                      echo "Migrating the PostgreSQL database ${FLYWAY_DATABASE}"

                      flyway \
                      -url="jdbc:postgresql://${FLYWAY_HOST}:${FLYWAY_PORT}/${FLYWAY_DATABASE}" \
                      -user="${FLYWAY_USER}" \
                      -password="${FLYWAY_PASSWORD}" \
                      -schemas="${FLYWAY_SCHEMA}" \
                      -defaultSchema="${FLYWAY_SCHEMA}" \
                      -locations=filesystem:/data/sql \
                      migrate
                  env:
                    - name: FLYWAY_HOST
                      value: ${POSTGRES_HOST}
                    - name: FLYWAY_PORT
                      value: ${POSTGRES_PORT}
                    - name: FLYWAY_USER
                      valueFrom:
                        secretKeyRef:
                          name: ${POSTGRES_SERVER_SECRET}
                          key: database-user
                    - name: FLYWAY_PASSWORD
                      valueFrom:
                        secretKeyRef:
                          name: ${POSTGRES_SERVER_SECRET}
                          key: database-password
                    - name: FLYWAY_DATABASE
                      valueFrom:
                        secretKeyRef:
                          name: ${POSTGRES_SERVER_SECRET}
                          key: database-name
                    - name: FLYWAY_SCHEMA
                      value: ${POSTGRES_SCHEMA}
                  volumeMounts:
                    - name: data-volume
                      mountPath: /data
              restartPolicy: OnFailure
              volumes:
                - name: data-volume
                  emptyDir: {}
