# Definition of environment variables
x-var:
  - &POSTGRES_USER
    nr-hrs
  - &POSTGRES_PASSWORD
    ${POSTGRES_PASSWORD}
  - &POSTGRES_DATABASE
    nr-hrs
  - &POSTGRES_HOST
    database

# Default logging configuration
x-defaults: &defaults
  logging:
    driver: "json-file"
    options:
      max-size: 10m
      max-file: "3"

services:
  # Postgres Database Service
  # We use by default the docker image we build locally, but you can
  # uncomment the image line to use the official image from Docker Hub,
  # and comment out the build section.
  database:
    container_name: *POSTGRES_HOST
    environment:
      POSTGRES_USER: *POSTGRES_USER
      POSTGRES_PASSWORD: *POSTGRES_PASSWORD
      POSTGRES_DB: *POSTGRES_DATABASE
    build:
      context: database
      dockerfile: Dockerfile
    #image: postgres:13.23
    ports: [5432:5432]
    volumes: ["/pgdata"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", *POSTGRES_USER]
      interval: 5s
      timeout: 10s
      retries: 10
    <<: *defaults

  # Oracle Legacy Database Service
  # We use by default the docker image we build locally, but you can
  # uncomment the image line to use the official image from Docker Hub,
  # and comment out the build section.
  legacydb:
    container_name: oracle
    #build:
    #  context: legacydb
    #  dockerfile: Dockerfile
    environment:
      # Use an environment variable for the Oracle password. Set APP_USER_PASSWORD in your .env file or environment.
      APP_USER_PASSWORD: ${APP_USER_PASSWORD}
      APP_USER: THE
      ORACLE_RANDOM_PASSWORD: yes
    platform: "linux/amd64"
    # This image is basically the same used in the Dockerfile, but prebuilt and
    # available in Docker Hub for convenience.
    image: gvenzl/oracle-free:23.9-slim-faststart
    ports: [1521:1521]
    volumes: [/opt/oracle/oradata]
    healthcheck:
      test: [ "CMD-SHELL", "healthcheck.sh" ]
      interval: 5s
      timeout: 10s
      retries: 10
    <<: *defaults

  # Flyway service to initialize/migrate the legacy Oracle DB
  # It depends on the legacydb service to ensure the DB is up before running migrations
  legacyflyway:
    container_name: flyway
    image: flyway/flyway
    command: -url=jdbc:oracle:thin:@legacydb:1521/FREEPDB1 -user=THE -password=${APP_USER_PASSWORD} -connectRetries=60 migrate
    volumes: [./legacy/src/test/resources/db/migration:/flyway/sql]
    depends_on:
      legacydb:
        condition: service_healthy
    <<: *defaults

  # MinIO Object Storage Service
  minio:
    container_name: minio
    image: ${MINIO_IMAGE:-cgr.dev/chainguard/minio:latest}
    command: server /data --console-address ":9001"
    environment:
      # Set MINIO_ROOT_USER and MINIO_ROOT_PASSWORD in your .env file or environment
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    <<: *defaults

  # MinIO Bucket Seeding Service
  minio-init:
    container_name: minio-init
    image: ${MINIO_CLIENT_IMAGE:-cgr.dev/chainguard/minio-client:latest}
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}; do
        sleep 1;
      done;
      mc mb --ignore-existing local/$${OBJECT_STORAGE_BUCKET:-nr-waste};
      exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-nr-waste}
    <<: *defaults

  # Backend Service
  # We use by default the docker image we build locally, but you can
  # uncomment the image line to use the official image from GitHub Container Registry,
  # and comment out the build section.
  backend:
    container_name: backend
    build:
      context: backend
      dockerfile: Dockerfile
    # When using the image from the registry, replace XXX with the desired tag
    #image: ghcr.io/bcgov/nr-waste-plus/backend:XXX
    ports: [8080:8080]
    # We map the volume to override the default configuration with our local config
    # It is easier than passing everything as environment variables
    volumes: [./backend/config:/app/config]
    environment:
      S3_FORCE_PATH_STYLE: "true"
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER}
      OBJECT_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-nr-waste}
    depends_on:
      database:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    <<: *defaults

  # Legacy Service
  # We use by default the docker image we build locally, but you can
  # uncomment the image line to use the official image from GitHub Container Registry,
  # and comment out the build section.
  legacy:
    container_name: legacy
    build:
      context: legacy
      dockerfile: Dockerfile
    # When using the image from the registry, replace XXX with the desired tag
    #image: ghcr.io/bcgov/nr-waste-plus/legacy:XXX
    ports: [9090:9090]
    # We map the volume to override the default configuration with our local config
    # It is easier like to than to pass everything as environment variables
    volumes: [./legacy/config:/app/config]
    depends_on: [legacydb, legacyflyway]
    <<: *defaults

  # Frontend Service
  # We use by default the docker image we build locally, but you can
  # uncomment the image line to use the official image from GitHub Container Registry,
  # and comment out the build section.
  # This service will be rarely used in development, as the frontend is usually run
  # using npm directly
  frontend:
    container_name: frontend
    build:
      context: frontend
      dockerfile: Dockerfile
    # When using the image from the registry, replace XXX with the desired tag
    #image: ghcr.io/bcgov/nr-waste-plus/frontend:XXX
    ports: [3000:3000]
    <<: *defaults

volumes:
  minio_data:
