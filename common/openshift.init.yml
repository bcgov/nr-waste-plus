apiVersion: template.openshift.io/v1
kind: Template
parameters:
  - name: NAME
    description: Product name
    value: nr-waste-plus
  - name: ZONE
    description: Deployment zone, e.g. pr-### or prod
    required: true
  - name: DB_PASSWORD
    description: Password for the PostgreSQL connection user.
    required: true
  - name: POSTGRES_HOST
    description: PostgreSQL host the backend connects to (e.g. the in-namespace database service or the data-center server)
    required: true
  - name: POSTGRES_PORT
    description: PostgreSQL port
    value: "5432"
  - name: POSTGRES_DATABASE
    description: PostgreSQL database the backend connects to (for PR zones, the tools workflow creates wasteplus_pr_<PR>)
    required: true
  - name: POSTGRES_USER
    description: PostgreSQL connection user
    required: true
  - name: ORACLEDB_USER
    description: Oracle database user name
    required: true
  - name: ORACLEDB_PASSWORD
    description: Oracle database password
    required: true
  - name: ORACLEDB_DATABASE
    description: Oracle database database name
    required: true
  - name: ORACLEDB_HOST
    description: Oracle database host
    required: true
  - name: ORACLEDB_SERVICENAME
    description: Oracle database service name
    required: true
  - name: ORACLEDB_SECRET
    description: Oracle database keystore secret/password
    required: true
  - name: IDX_PVC_SIZE
    description: Volume space available for data, e.g. 512Mi, 2Gi.
    displayName: Database Volume Capacity
    required: true
    value: 256Mi
  - name: COGNITO_CLIENT_ID
    required: true
  - name: COGNITO_DOMAIN
    value: "prod-fam-user-pool-domain"
  - name: COGNITO_ENVIRONMENT
    required: true
  - name: COGNITO_USER_POOL
    description: Cognito user pool id
    required: true
  - name: COGNITO_REGION
    description: Cognito region information
    value: "ca-central-1"
  - name: VITE_LEGACY_BASE_URL
    description: Green domain
    required: true
  - name: LANDING_URL
    required: true
  - name: URL_FRONTEND
    description: Frontend URL
    required: true
  - name: DOMAIN
    value: apps.silver.devops.gov.bc.ca
  - name: SPRING_PROFILES_ACTIVE
    description: Spring profile
    required: true
  - name: VITE_NODE_ENV
    required: true
  - name: VITE_CLIENT_BASE_URL
    required: true
  - name: CLIENT_BASE_URL
    required: true
  - name: CLIENT_BASE_KEY
    required: true
  - name: VITE_ZONE
    required: true
  - name: VITE_FAM_DOMAIN
    required: true
  - name: VITE_BCEID_HELP
    required: true
  - name: VITE_IDIR_HELP
    required: true
  - name: OBJECT_STORAGE_ENDPOINT
    description: S3 or MinIO endpoint URL
    value: ""
  - name: OBJECT_STORAGE_PRESIGNER_ENDPOINT
    description: S3 or MinIO presigner endpoint URL; leave unset to sign against OBJECT_STORAGE_ENDPOINT
    value: ""
  - name: OBJECT_STORAGE_ACCESS_KEY
    description: S3 or MinIO access key
    value: ""
  - name: OBJECT_STORAGE_SECRET_KEY
    description: S3 or MinIO secret key
    value: ""
  - name: OBJECT_STORAGE_BUCKET
    description: S3 or MinIO bucket name
    value: "nr-waste"
  - name: OBJECT_STORAGE_REGION
    description: S3 or MinIO region
    value: "ca-central-1"
  - name: OBJECT_STORAGE_FORCE_PATH_STYLE
    description: Force path style for S3 requests
    value: "false"
objects:
  - apiVersion: v1
    kind: Secret
    metadata:
      name: ${NAME}-${ZONE}
      labels:
        app: ${NAME}-${ZONE}
    stringData:
      database-name: ${POSTGRES_DATABASE}
      database-password: ${DB_PASSWORD}
      database-user: ${POSTGRES_USER}
      database-host: ${POSTGRES_HOST}
      database-port: ${POSTGRES_PORT}
      oracle-user: ${ORACLEDB_USER}
      oracle-password: ${ORACLEDB_PASSWORD}
      oracle-database: ${ORACLEDB_DATABASE}
      oracle-host: ${ORACLEDB_HOST}
      oracle-service: ${ORACLEDB_SERVICENAME}
      oracle-secret: ${ORACLEDB_SECRET}
      cognito-user-pool: ${COGNITO_USER_POOL}
      cognito-client-id: ${COGNITO_CLIENT_ID}
      cognito-environment: ${COGNITO_ENVIRONMENT}
      spring-profiles-active: "container,${SPRING_PROFILES_ACTIVE}"
      client-base-url: ${CLIENT_BASE_URL}
      client-base-key: ${CLIENT_BASE_KEY}
      fam-domain: ${VITE_FAM_DOMAIN}
      object-storage-endpoint: ${OBJECT_STORAGE_ENDPOINT}
      object-storage-presigner-endpoint: ${OBJECT_STORAGE_PRESIGNER_ENDPOINT}
      object-storage-access-key: ${OBJECT_STORAGE_ACCESS_KEY}
      object-storage-secret-key: ${OBJECT_STORAGE_SECRET_KEY}
      object-storage-bucket: ${OBJECT_STORAGE_BUCKET}
      object-storage-region: ${OBJECT_STORAGE_REGION}
      object-storage-force-path-style: ${OBJECT_STORAGE_FORCE_PATH_STYLE}
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: allow-from-openshift-ingress
      labels:
        template: openshift-test
    spec:
      podSelector: {}
      ingress:
        - from:
            - namespaceSelector:
                matchLabels:
                  network.openshift.io/policy-group: ingress
      policyTypes:
        - Ingress
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: allow-same-namespace
      labels:
        template: quickstart-network-security-policy
    spec:
      podSelector: {}
      ingress:
        - from:
            - podSelector: {}
      policyTypes:
        - Ingress
  - kind: ConfigMap
    apiVersion: v1
    metadata:
      labels:
        app: ${NAME}-${ZONE}
      name: ${NAME}-${ZONE}-frontend
    data:
      config.js: |
        window.config = {
          VITE_BACKEND_URL: 'https://${NAME}-${ZONE}-backend.${DOMAIN}',
          VITE_FRONTEND_URL: 'https://${URL_FRONTEND}',
          VITE_NODE_ENV: '${VITE_NODE_ENV}',
          VITE_APP_NAME: 'Waste Plus',
          VITE_FEATURE_FLAGS: {
            OFFLINE: true
          },
          VITE_ZONE: '${VITE_ZONE}',
          VITE_USER_POOLS_ID: '${COGNITO_USER_POOL}',
          VITE_LEGACY_BASE_URL: '${VITE_LEGACY_BASE_URL}',
          VITE_CLIENT_BASE_URL: '${CLIENT_BASE_URL}',
          VITE_USER_POOLS_WEB_CLIENT_ID: '${COGNITO_CLIENT_ID}',
          VITE_FAM_DOMAIN: '${VITE_FAM_DOMAIN}',
          VITE_BCEID_HELP: '${VITE_BCEID_HELP}',
          VITE_IDIR_HELP: '${VITE_IDIR_HELP}'
        };
