name: Bugfix Task
description: Use this template to report and address bugs.
title: "[BUGFIX]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Please provide details about the bug to help us resolve it efficiently.**
        Fill out all required fields to ensure we have the necessary context.

  - type: input
    id: bug_summary
    attributes:
      label: Bug Summary
      placeholder: Provide a concise summary of the bug.
    validations:
      required: true

  - type: textarea
    id: bug_description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
      placeholder: e.g., The feature breaks when X happens.
    validations:
      required: true

  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: Steps to Reproduce
      description: Outline the steps to reproduce the behavior.
      placeholder: |
        1. Open the page or feature where the problem occurs.
        2. Take the action that triggers the problem.
        3. Describe what happens.
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
      placeholder: e.g., The system should display a confirmation dialog.

  - type: textarea
    id: actual_behavior
    attributes:
      label: Actual Behavior
      description: A clear and concise description of what actually happened.
      placeholder: e.g., The system crashes when the dialog is triggered.

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Attach screenshots to help explain the problem. (Optional)
      placeholder: Attach images or paste links if they help explain the problem.

  - type: checkboxes
    id: environment
    attributes:
      label: Affected Environments
      description: Select the environments where this bug occurs.
      options:
        - label: Development
        - label: Test
        - label: Production

  - type: textarea
    id: desktop_info
    attributes:
      label: Browser and Device Information
      description: Provide the browser, device, and operating system where the bug occurred, if known.
      placeholder: |
        Operating system:
        Device (optional):
        Browser and version:

  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      description: Add any other relevant information or context.
      placeholder: e.g., Related tickets, logs, or PRs.
