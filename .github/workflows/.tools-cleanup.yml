name: Tools environment cleanup

on:
  workflow_call:

permissions: {}

jobs:
  tools-cleanup:
    name: Cleanup tools environment
    runs-on: ubuntu-26.04
    steps:
      - name: Scale down legacy
        continue-on-error: true
        uses: bcgov/action-oc-runner@111868d1fc50db0a40417ba321d865ef5c931bbd # v1.7.0
        with:
          oc_namespace: ${{ secrets.oc_namespace }}
          oc_token: ${{ secrets.oc_token }}
          oc_server: ${{ secrets.oc_server }}
          commands: |
            oc scale deployment/nr-waste-plus-${{ github.event.number }}-legacy --replicas=0
            undesired_replicas=0

            while true; do
              available_replicas=$(oc get deployment/nr-waste-plus-${{ github.event.number }}-legacy -n ${{ secrets.OC_NAMESPACE }} -o jsonpath='{.status.availableReplicas}')

              if [[ "$available_replicas" -ge "$undesired_replicas" ]]; then
                echo "DeploymentConfig ${{ secrets.OC_NAMESPACE }}-${{ github.event.number }}-legacy is now available with $available_replicas replicas."
                break
              fi

              echo "Waiting... ($available_replicas pods available)"
              sleep 5
            done
            sleep 10

      - name: Remove the PR database
        continue-on-error: true
        uses: bcgov/action-oc-runner@111868d1fc50db0a40417ba321d865ef5c931bbd # v1.7.0
        with:
          oc_namespace: cffaf3-tools
          oc_server: ${{ secrets.oc_server }}
          oc_token: ${{ secrets.oc_token_tools }}
          commands: |
            # This removes a new pluggable database, user and service for the PR
            for i in {1..5}; do
              POD_NAME=$(oc get pods -l app=nr-waste-plus-tools -l deployment=nr-waste-plus-tools-legacydb -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
              if [ -n "$POD_NAME" ]; then
                echo "Pod found: $POD_NAME"
                oc exec $POD_NAME -- /opt/oracle/removeDatabase "THE" "PR_${{ github.event.number }}"
                break
              else
                echo "Pod not found, retrying in 10 seconds... ($i/5)"
                sleep 10
              fi
            done

            if [ -z "$POD_NAME" ]; then
              echo "Failed to find the pod after 5 attempts."
            fi

      - name: Remove the PR PostgreSQL database
        uses: bcgov/action-oc-runner@111868d1fc50db0a40417ba321d865ef5c931bbd # v1.7.0
        with:
          oc_namespace: cffaf3-tools
          oc_server: ${{ secrets.oc_server }}
          oc_token: ${{ secrets.oc_token_tools }}
          commands: |
            set -uo pipefail

            NS="cffaf3-tools"
            PR="${{ github.event.number }}"
            CRONJOB="nr-waste-plus-pr${PR}-removepg"
            JOB="remove-pr${PR}-cleanup-${{ github.run_attempt }}-$(date +%s)"

            # Block on the Job with watches instead of polling: oc wait returns the
            # moment the Job reports a condition. Completion and failure are
            # watched together, and the status is re-read once afterwards so a
            # dropped watch only costs another round, not a false result.
            wait_for_job() {
              local job="$1" deadline remaining ok_pid fail_pid counts
              deadline=$(( $(date +%s) + $2 ))
              succeeded=0
              failed=0
              while [ "$(date +%s)" -lt "${deadline}" ]; do
                remaining=$(( deadline - $(date +%s) ))
                oc wait --for=condition=complete "job/${job}" -n "${NS}" --timeout="${remaining}s" >/dev/null 2>&1 &
                ok_pid=$!
                oc wait --for=condition=failed "job/${job}" -n "${NS}" --timeout="${remaining}s" >/dev/null 2>&1 &
                fail_pid=$!
                # Stop as soon as either watch has returned. Checking the local
                # PIDs makes no API calls.
                while kill -0 "${ok_pid}" 2>/dev/null && kill -0 "${fail_pid}" 2>/dev/null; do
                  sleep 1
                done
                kill "${ok_pid}" "${fail_pid}" 2>/dev/null || true
                wait "${ok_pid}" "${fail_pid}" 2>/dev/null || true

                counts=$(oc get "job/${job}" -n "${NS}" -o jsonpath='{.status.succeeded}/{.status.failed}' 2>/dev/null || true)
                succeeded="${counts%%/*}"
                failed="${counts##*/}"
                succeeded="${succeeded:-0}"
                failed="${failed:-0}"
                if [ "${succeeded}" -ge 1 ] || [ "${failed}" -ge 1 ]; then
                  return 0
                fi
                echo "Waiting for job ${job} (succeeded=${succeeded}, failed=${failed})..."
                sleep 2
              done
            }

            RENDERED=$(oc create job --from="cronjob/${CRONJOB}" "${JOB}" \
              --dry-run=client -o yaml)
            RENDERED=$(printf '%s\n' "${RENDERED}" \
              | sed "s/value: \"0\"/value: \"${PR}\"/g")
            if ! printf '%s\n' "${RENDERED}" | oc apply -n "${NS}" -f -; then
              echo "::error::Could not create database removal job ${JOB}."
              exit 1
            fi

            wait_for_job "${JOB}" 300

            oc logs "job/${JOB}" -n "${NS}" --tail=100 || true
            if [ "${succeeded}" -lt 1 ]; then
              oc describe "job/${JOB}" -n "${NS}" || true
              echo "::error::PostgreSQL database removal failed for PR ${PR}."
              exit 1
            fi

      - name: Remove the PR PostgreSQL CronJobs and credentials
        continue-on-error: true
        uses: bcgov/action-oc-runner@111868d1fc50db0a40417ba321d865ef5c931bbd # v1.7.0
        with:
          oc_namespace: cffaf3-tools
          oc_server: ${{ secrets.oc_server }}
          oc_token: ${{ secrets.oc_token_tools }}
          commands: |
            oc delete cronjob/nr-waste-plus-pr${{ github.event.number }}-removepg \
              cronjob/nr-waste-plus-pr${{ github.event.number }}-createpg \
              cronjob/nr-waste-plus-pr${{ github.event.number }}-droppg \
              cronjob/nr-waste-plus-pr${{ github.event.number }}-migratepg \
              secret/nr-waste-plus-pr${{ github.event.number }}-postgres \
              -n cffaf3-tools --ignore-not-found

      - name: Remove the PR MinIO bucket
        continue-on-error: true
        uses: bcgov/action-oc-runner@111868d1fc50db0a40417ba321d865ef5c931bbd # v1.7.0
        env:
          OBJECT_STORAGE_BUCKET: ${{ secrets.OBJECT_STORAGE_BUCKET || 'nr-waste' }}-pr-${{ github.event.number }}
        with:
          oc_namespace: cffaf3-tools
          oc_token: ${{ secrets.oc_token_tools }}
          oc_server: ${{ secrets.oc_server }}
          commands: |
            # Remove only this PR's bucket. The shared MinIO server and the
            # base bucket are left intact for other open PRs.
            POD_NAME=$(oc get pods -l app=nr-waste-plus-tools -l deployment=nr-waste-plus-tools-minio -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
            if [ -z "$POD_NAME" ]; then
              echo "MinIO pod not found; nothing to clean up."
              exit 0
            fi

            oc exec "$POD_NAME" -c minio-init -- sh -c '
              mc --config-dir /tmp/.mc alias set local http://localhost:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" >/dev/null 2>&1 || exit 0
              mc --config-dir /tmp/.mc rm --recursive --force local/"$1" >/dev/null 2>&1 || true
              mc --config-dir /tmp/.mc rb --force local/"$1" >/dev/null 2>&1 || true
            ' _ "$OBJECT_STORAGE_BUCKET"
            echo "Removed bucket $OBJECT_STORAGE_BUCKET (if it existed)."

      - name: Remove completed pods and jobs (cronjobs)
        continue-on-error: true
        uses: bcgov/action-oc-runner@111868d1fc50db0a40417ba321d865ef5c931bbd # v1.7.0
        with:
          oc_namespace: cffaf3-tools
          oc_token: ${{ secrets.oc_token_tools }}
          oc_server: ${{ secrets.oc_server }}
          commands: |
            # Scope to this PR: migration job names include -pr<number>-.
            JOBS=$(oc get jobs -n cffaf3-tools -o name | grep -E -- "-pr${{ github.event.number }}-" || true)
            if [ -n "$JOBS" ]; then
              oc delete $JOBS -n cffaf3-tools --ignore-not-found
            fi
