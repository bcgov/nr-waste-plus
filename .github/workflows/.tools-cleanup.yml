name: Tools environment cleanup

on:
  workflow_call:

permissions: {}

# Every step removes one kind of resource, so they are independent: a failure in
# one must not stop the others from running, and must still leave the run red.
# Removal is verified instead of assumed. Only real answers are acted on: a
# refused or timed-out API connection is retried and never read as "it is
# already gone".
jobs:
  tools-cleanup:
    name: Cleanup tools environment
    runs-on: ubuntu-26.04
    steps:
      # Stops the PR legacy app so it releases its sessions on the Oracle
      # database. Best effort: removeDatabase closes the database with
      # IMMEDIATE, and the PR deployment may already be gone.
      - name: Scale down legacy
        continue-on-error: true
        uses: bcgov/action-oc-runner@111868d1fc50db0a40417ba321d865ef5c931bbd # v1.7.0
        env:
          STOP_NAMESPACE: ${{ secrets.OC_NAMESPACE }}
          STOP_DEPLOYMENT: nr-waste-plus-${{ github.event.number }}-legacy
        with:
          oc_namespace: ${{ secrets.oc_namespace }}
          oc_token: ${{ secrets.oc_token }}
          login_attempts: "8"
          oc_server: ${{ secrets.oc_server }}
          commands: bash .github/scripts/manage-deployment.sh stop "$STOP_NAMESPACE" "$STOP_DEPLOYMENT" --wait --after-stop-delay 10

      # removeDatabase drops the PR's user, pluggable database and service, so
      # it only has to be called. The result is checked afterwards, because a
      # leaked pluggable database keeps using the instance's memory.
      - name: Remove the PR Oracle database
        if: ${{ !cancelled() }}
        uses: bcgov/action-oc-runner@111868d1fc50db0a40417ba321d865ef5c931bbd # v1.7.0
        env:
          PR_NUMBER: ${{ github.event.number }}
        with:
          oc_namespace: cffaf3-tools
          oc_server: ${{ secrets.oc_server }}
          oc_token: ${{ secrets.oc_token_tools }}
          login_attempts: "8"
          commands: bash .github/scripts/remove-oracle-pr.sh cffaf3-tools "$PR_NUMBER"

      # Only this PR's bucket goes. The shared MinIO server and the base bucket
      # stay for the other open PRs.
      - name: Remove the PR MinIO bucket
        if: ${{ !cancelled() }}
        uses: bcgov/action-oc-runner@111868d1fc50db0a40417ba321d865ef5c931bbd # v1.7.0
        env:
          OBJECT_STORAGE_BUCKET: ${{ secrets.OBJECT_STORAGE_BUCKET || 'nr-waste' }}-pr-${{ github.event.number }}
        with:
          oc_namespace: cffaf3-tools
          oc_token: ${{ secrets.oc_token_tools }}
          login_attempts: "8"
          oc_server: ${{ secrets.oc_server }}
          commands: bash .github/scripts/remove-minio-pr-bucket.sh cffaf3-tools "$OBJECT_STORAGE_BUCKET"

      # Drops the PR database on the shared instance by running the removal
      # CronJob that the tools deployment created for this PR.
      - name: Remove the PR PostgreSQL database
        id: remove-pg
        if: ${{ !cancelled() }}
        uses: bcgov/action-oc-runner@111868d1fc50db0a40417ba321d865ef5c931bbd # v1.7.0
        env:
          PR_NUMBER: ${{ github.event.number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        with:
          oc_namespace: cffaf3-tools
          oc_server: ${{ secrets.oc_server }}
          oc_token: ${{ secrets.oc_token_tools }}
          login_attempts: "8"
          commands: bash .github/scripts/remove-postgres-pr-database.sh cffaf3-tools "$PR_NUMBER" "$RUN_ATTEMPT"

      # Only after the database is gone: the CronJobs and credentials are what
      # a retry of the removal would need.
      - name: Remove the PR PostgreSQL CronJobs and credentials
        if: ${{ !cancelled() && steps.remove-pg.outcome == 'success' }}
        continue-on-error: true
        uses: bcgov/action-oc-runner@111868d1fc50db0a40417ba321d865ef5c931bbd # v1.7.0
        with:
          oc_namespace: cffaf3-tools
          oc_server: ${{ secrets.oc_server }}
          oc_token: ${{ secrets.oc_token_tools }}
          login_attempts: "8"
          commands: |
            oc delete cronjob/nr-waste-plus-pr${{ github.event.number }}-removepg \
              cronjob/nr-waste-plus-pr${{ github.event.number }}-createpg \
              cronjob/nr-waste-plus-pr${{ github.event.number }}-droppg \
              cronjob/nr-waste-plus-pr${{ github.event.number }}-migratepg \
              secret/nr-waste-plus-pr${{ github.event.number }}-postgres \
              -n cffaf3-tools --ignore-not-found

      - name: Remove completed pods and jobs (cronjobs)
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: bcgov/action-oc-runner@111868d1fc50db0a40417ba321d865ef5c931bbd # v1.7.0
        with:
          oc_namespace: cffaf3-tools
          oc_token: ${{ secrets.oc_token_tools }}
          login_attempts: "8"
          oc_server: ${{ secrets.oc_server }}
          commands: |
            # Scope to this PR: job names include -pr<number>-.
            JOBS=$(oc get jobs -n cffaf3-tools -o name | grep -E -- "-pr${{ github.event.number }}-" || true)
            if [ -n "$JOBS" ]; then
              oc delete $JOBS -n cffaf3-tools --ignore-not-found
            fi
