name: Tools deployment

on:
  pull_request:

concurrency:
  # PR open and close use the same group, allowing only one at a time
  group: tools-${{ github.event.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  builds:
    name: Builds
    runs-on: ubuntu-26.04
    permissions:
      packages: write
    steps:
      - uses: bcgov/action-builder-ghcr@cb2629351c87dd1c2130073e4ebb7233a9653a63 # v4.4.1
        name: Build (legacydb)
        with:
          package: legacydb
          tag_fallback: latest
          triggers: ('legacydb/')

  pre-tools:
    name: Pre Deploy Tools
    runs-on: ubuntu-26.04
    steps:
      - name: Remove completed jobs for this PR
        continue-on-error: true
        uses: bcgov/action-oc-runner@111868d1fc50db0a40417ba321d865ef5c931bbd # v1.7.0
        with:
          oc_namespace: cffaf3-tools
          oc_server: ${{ secrets.oc_server }}
          oc_token: ${{ secrets.oc_token_tools }}
          commands: |
            # Scope to this PR: migration job names include -pr<number>-.
            # This runs before the parallel paths create their jobs so the
            # paths cannot delete each other's work.
            JOBS=$(oc get jobs -n cffaf3-tools -o name | grep -E -- "-pr${{ github.event.number }}-" || true)
            if [ -n "$JOBS" ]; then
              oc delete $JOBS -n cffaf3-tools --ignore-not-found
            fi

      - name: Remove completed PostgreSQL jobs for this PR
        continue-on-error: true
        uses: bcgov/action-oc-runner@111868d1fc50db0a40417ba321d865ef5c931bbd # v1.7.0
        with:
          oc_namespace: ${{ secrets.oc_namespace }}
          oc_server: ${{ secrets.oc_server }}
          oc_token: ${{ secrets.oc_token }}
          commands: |
            # The per-PR PostgreSQL jobs run beside the per-PR database, so
            # they pile up here on every push rather than in the tools
            # namespace. Scope to this PR: the names include -pr<number>-.
            JOBS=$(oc get jobs -n ${{ secrets.OC_NAMESPACE }} -o name | grep -E -- "-pr${{ github.event.number }}-" || true)
            if [ -n "$JOBS" ]; then
              oc delete $JOBS -n ${{ secrets.OC_NAMESPACE }} --ignore-not-found
            fi

  deploy-postgres:
    name: Deploy PostgreSQL
    needs: [pre-tools]
    runs-on: ubuntu-26.04
    steps:
      - name: Wait for the PR database
        uses: bcgov/action-oc-runner@111868d1fc50db0a40417ba321d865ef5c931bbd # v1.7.0
        with:
          oc_namespace: ${{ secrets.oc_namespace }}
          oc_server: ${{ secrets.oc_server }}
          oc_token: ${{ secrets.oc_token }}
          commands: |
            set -uo pipefail

            NS="${{ secrets.OC_NAMESPACE }}"
            STATEFULSET="nr-waste-plus-${{ github.event.number }}-database"

            # The database component is deployed by the PR Open workflow, which
            # runs in parallel with this one, so the StatefulSet may not exist
            # yet. Wait for it instead of failing on a race that resolves.
            deadline=$(( $(date +%s) + 600 ))
            while [ "$(date +%s)" -lt "${deadline}" ]; do
              ready=$(oc get "statefulset/${STATEFULSET}" -n "${NS}" -o jsonpath='{.status.readyReplicas}' 2>/dev/null || true)
              if [ "${ready:-0}" -ge 1 ]; then
                echo "StatefulSet ${STATEFULSET} is ready."
                exit 0
              fi
              echo "Waiting for ${STATEFULSET} to become ready..."
              sleep 10
            done

            echo "::error::StatefulSet ${STATEFULSET} did not become ready within 10 minutes."
            exit 1

      - name: Remove the existing PostgreSQL CronJobs
        uses: bcgov/action-oc-runner@111868d1fc50db0a40417ba321d865ef5c931bbd # v1.7.0
        with:
          oc_namespace: ${{ secrets.oc_namespace }}
          oc_server: ${{ secrets.oc_server }}
          oc_token: ${{ secrets.oc_token }}
          commands: |
            # The pod template of a CronJob is immutable, so an existing
            # CronJob has to be removed before the new template is applied.
            oc delete cronjob/nr-waste-plus-pr${{ github.event.number }}-droppg -n ${{ secrets.OC_NAMESPACE }} --ignore-not-found
            oc delete cronjob/nr-waste-plus-pr${{ github.event.number }}-migratepg -n ${{ secrets.OC_NAMESPACE }} --ignore-not-found

      - name: Initializing PostgreSQL CronJobs
        uses: bcgov/action-deployer-openshift@e2d60eb9cacceb89c3b97d8dcf0a2c460eea5eab # v4.2.3
        with:
          file: tools/postgres.deploy.yml
          oc_namespace: ${{ secrets.oc_namespace }}
          oc_server: ${{ secrets.oc_server }}
          oc_token: ${{ secrets.oc_token }}
          oc_version: "4.13"
          overwrite: true
          parameters: -p NAME=nr-waste-plus
            -p ZONE=pr${{ github.event.number }}
            -p POSTGRES_HOST=nr-waste-plus-${{ github.event.number }}-database
            -p POSTGRES_PORT=5432
            -p POSTGRES_SERVER_SECRET=nr-waste-plus-${{ github.event.number }}
            -p POSTGRES_SCHEMA=hrs

      # Drop runs as its own job so a failure to drop is reported as a drop
      # failure, not as a migration failure. It also guarantees the migration
      # starts from an empty database, so a Flyway history from an earlier
      # revision of the branch cannot block the current one.
      - name: Drop the PR postgres database
        uses: bcgov/action-oc-runner@111868d1fc50db0a40417ba321d865ef5c931bbd # v1.7.0
        with:
          oc_namespace: ${{ secrets.oc_namespace }}
          oc_server: ${{ secrets.oc_server }}
          oc_token: ${{ secrets.oc_token }}
          commands: |
            set -uo pipefail

            JOB_NAME="droppg-pr${{ github.event.number }}-${{ github.run_attempt }}-$(date +%s)"
            if ! oc create job --from=cronjob/nr-waste-plus-pr${{ github.event.number }}-droppg "${JOB_NAME}" --dry-run=client -o yaml \
              | oc apply -f -; then
              echo "::error::Could not create the PostgreSQL drop job ${JOB_NAME}."
              exit 1
            fi

            deadline=$(( $(date +%s) + 300 ))
            succeeded=0
            failed=0
            while [ "$(date +%s)" -lt "${deadline}" ]; do
              counts=$(oc get job "${JOB_NAME}" -n ${{ secrets.OC_NAMESPACE }} \
                -o jsonpath='{.status.succeeded}/{.status.failed}' 2>/dev/null || true)
              succeeded="${counts%%/*}"
              failed="${counts##*/}"
              succeeded="${succeeded:-0}"
              failed="${failed:-0}"
              if [ "${succeeded}" -ge 1 ] || [ "${failed}" -ge 1 ]; then
                break
              fi
              echo "Waiting for job ${JOB_NAME} to finish (succeeded=${succeeded}, failed=${failed})..."
              sleep 10
            done

            echo "--- job logs ---"
            oc logs "job/${JOB_NAME}" -n ${{ secrets.OC_NAMESPACE }} --tail=100 || true
            if [ "${succeeded}" -lt 1 ]; then
              echo "--- job description ---"
              oc describe "job/${JOB_NAME}" -n ${{ secrets.OC_NAMESPACE }} || true
              echo "::error::Dropping the PostgreSQL database failed for PR ${{ github.event.number }} (succeeded=${succeeded}, failed=${failed})."
              exit 1
            fi

      - name: Migrate the PR postgres database
        uses: bcgov/action-oc-runner@111868d1fc50db0a40417ba321d865ef5c931bbd # v1.7.0
        with:
          oc_namespace: ${{ secrets.oc_namespace }}
          oc_server: ${{ secrets.oc_server }}
          oc_token: ${{ secrets.oc_token }}
          commands: |
            set -uo pipefail

            BRANCH_NAME="${{ github.head_ref }}"
            ESCAPED_BRANCH_NAME=$(echo "$BRANCH_NAME" | sed 's/[\/&]/\\&/g')
            JOB_NAME="migratepg-pr${{ github.event.number }}-${{ github.run_attempt }}-$(date +%s)"

            # oc re-serializes the cronjob template, so the branch value comes
            # back unquoted ("value: main"). Matching the bare form is what
            # makes the job migrate this branch instead of main.
            if ! oc create job --from=cronjob/nr-waste-plus-pr${{ github.event.number }}-migratepg "${JOB_NAME}" --dry-run=client -o yaml \
              | sed "s/value: main/value: ${ESCAPED_BRANCH_NAME}/" \
              | oc apply -f -; then
              echo "::error::Could not create the PostgreSQL migration job ${JOB_NAME}."
              exit 1
            fi

            deadline=$(( $(date +%s) + 900 ))
            succeeded=0
            failed=0
            while [ "$(date +%s)" -lt "${deadline}" ]; do
              counts=$(oc get job "${JOB_NAME}" -n ${{ secrets.OC_NAMESPACE }} \
                -o jsonpath='{.status.succeeded}/{.status.failed}' 2>/dev/null || true)
              succeeded="${counts%%/*}"
              failed="${counts##*/}"
              succeeded="${succeeded:-0}"
              failed="${failed:-0}"
              if [ "${succeeded}" -ge 1 ] || [ "${failed}" -ge 1 ]; then
                break
              fi
              echo "Waiting for job ${JOB_NAME} to finish (succeeded=${succeeded}, failed=${failed})..."
              sleep 10
            done

            echo "--- job logs ---"
            oc logs "job/${JOB_NAME}" -n ${{ secrets.OC_NAMESPACE }} --tail=200 || true
            if [ "${succeeded}" -lt 1 ]; then
              echo "--- job description ---"
              oc describe "job/${JOB_NAME}" -n ${{ secrets.OC_NAMESPACE }} || true
              echo "::error::The PostgreSQL migration failed for PR ${{ github.event.number }} (succeeded=${succeeded}, failed=${failed})."
              exit 1
            fi
  deploy-oracle:
    name: Deploy Oracle Database
    needs: [pre-tools, builds]
    runs-on: ubuntu-26.04
    steps:
      - name: Initializing Deployment
        uses: bcgov/action-deployer-openshift@e2d60eb9cacceb89c3b97d8dcf0a2c460eea5eab # v4.2.3
        with:
          file: tools/oracle.deploy.yml
          oc_namespace: cffaf3-tools
          oc_server: ${{ secrets.oc_server }}
          oc_token: ${{ secrets.oc_token_tools }}
          oc_version: "4.13"
          overwrite: false
          parameters: -p ZONE=tools
            -p ORACLEDB_PASSWORD=${{ secrets.ORACLEDB_PASSWORD }}
            -p TAG=${{ github.event.number }}

      - name: Stop the legacy service
        uses: bcgov/action-oc-runner@111868d1fc50db0a40417ba321d865ef5c931bbd # v1.7.0
        with:
          oc_namespace: ${{ secrets.oc_namespace }}
          oc_server: ${{ secrets.oc_server }}
          oc_token: ${{ secrets.oc_token }}
          commands: |
            set -uo pipefail

            NS="${{ secrets.OC_NAMESPACE }}"
            LEGACY="nr-waste-plus-${{ github.event.number }}-legacy"

            # A missing deployment means the PR app has never been deployed, so
            # there is nothing holding the pluggable database. Any other oc
            # error must fail the path instead of leaving the app running.
            if ! oc get "deployment/${LEGACY}" -n "${NS}" >/dev/null 2>&1; then
              echo "Deployment ${LEGACY} does not exist yet; nothing to stop."
              exit 0
            fi

            oc scale "deployment/${LEGACY}" --replicas=0 -n "${NS}"

            deadline=$(( $(date +%s) + 300 ))
            while [ "$(date +%s)" -lt "${deadline}" ]; do
              available=$(oc get "deployment/${LEGACY}" -n "${NS}" -o jsonpath='{.status.availableReplicas}' 2>/dev/null || true)
              if [ "${available:-0}" -eq 0 ]; then
                echo "Deployment ${LEGACY} is stopped."
                exit 0
              fi
              echo "Waiting for ${LEGACY} to stop (${available} pod(s) still available)..."
              sleep 5
            done

            echo "::error::Deployment ${LEGACY} did not scale to zero within 5 minutes."
            exit 1
      - name: Remove the PR database
        continue-on-error: true
        uses: bcgov/action-oc-runner@111868d1fc50db0a40417ba321d865ef5c931bbd # v1.7.0
        with:
          oc_namespace: cffaf3-tools
          oc_server: ${{ secrets.oc_server }}
          oc_token: ${{ secrets.oc_token_tools }}
          commands: |
            # This removes a new pluggable database, user and service for the PR
            for i in {1..5}; do
              POD_NAME=$(oc get pods -l app=nr-waste-plus-tools -l deployment=nr-waste-plus-tools-legacydb -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
              if [ -n "$POD_NAME" ]; then
                echo "Pod found: $POD_NAME"
                oc exec $POD_NAME -- /opt/oracle/removeDatabase "THE" "PR_${{ github.event.number }}"
                break
              else
                echo "Pod not found, retrying in 10 seconds... ($i/5)"
                sleep 10
              fi
            done

            if [ -z "$POD_NAME" ]; then
              echo "Failed to find the pod after 5 attempts."
            fi

      - name: Create the PR database
        continue-on-error: true
        uses: bcgov/action-oc-runner@111868d1fc50db0a40417ba321d865ef5c931bbd # v1.7.0
        with:
          oc_namespace: cffaf3-tools
          oc_server: ${{ secrets.oc_server }}
          oc_token: ${{ secrets.oc_token_tools }}
          commands: |
            # This creates a new pluggable database for the PR
            for i in {1..5}; do
              POD_NAME=$(oc get pods -l app=nr-waste-plus-tools  -l deployment=nr-waste-plus-tools-legacydb -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
              if [ -n "$POD_NAME" ]; then
                echo "Pod found: $POD_NAME"
                oc exec $POD_NAME -- /opt/oracle/createDatabase PR_${{ github.event.number }}
                break
              else
                echo "Pod not found, retrying in 10 seconds... ($i/5)"
                sleep 10
              fi
            done

            if [ -z "$POD_NAME" ]; then
              echo "Failed to find the pod after 5 attempts."
            fi

      - name: Create the PR user
        continue-on-error: true
        uses: bcgov/action-oc-runner@111868d1fc50db0a40417ba321d865ef5c931bbd # v1.7.0
        with:
          oc_namespace: cffaf3-tools
          oc_server: ${{ secrets.oc_server }}
          oc_token: ${{ secrets.oc_token_tools }}
          commands: |
            # This creates a new pluggable database for the PR
            for i in {1..5}; do
              POD_NAME=$(oc get pods -l app=nr-waste-plus-tools -l deployment=nr-waste-plus-tools-legacydb -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
              if [ -n "$POD_NAME" ]; then
                echo "Pod found: $POD_NAME"
                oc exec $POD_NAME -- /opt/oracle/createAppUser "THE" "${{ secrets.ORACLEDB_PASSWORD }}" "PR_${{ github.event.number }}"
                break
              else
                echo "Pod not found, retrying in 10 seconds... ($i/5)"
                sleep 10
              fi
            done

            if [ -z "$POD_NAME" ]; then
              echo "Failed to find the pod after 5 attempts."
            fi

      # This is the last thing that validates the PR database. The create steps
      # above are continue-on-error because they also fail when the objects
      # already exist, so Flyway is what surfaces a broken pluggable database.
      # It must stay red on failure and must wait for the Job: applying the Job
      # only means the API server accepted it.
      - name: Migrate the PR database
        uses: bcgov/action-oc-runner@111868d1fc50db0a40417ba321d865ef5c931bbd # v1.7.0
        with:
          oc_namespace: cffaf3-tools
          oc_server: ${{ secrets.oc_server }}
          oc_token: ${{ secrets.oc_token_tools }}
          commands: |
            set -uo pipefail

            BRANCH_NAME="${{ github.head_ref }}"
            ESCAPED_BRANCH_NAME=$(echo "$BRANCH_NAME" | sed 's/[\/&]/\\&/g')
            JOB_NAME="migrate-pr${{ github.event.number }}-${{ github.run_attempt }}-$(date +%s)"

            # oc re-serializes the cronjob template, so the branch value comes
            # back unquoted ("value: main") while "0" keeps its quotes.
            if ! oc create job --from=cronjob/nr-waste-plus-tools-migratedb "${JOB_NAME}" --dry-run=client -o yaml \
              | sed "s/value: main/value: ${ESCAPED_BRANCH_NAME}/" \
              | sed "s/value: \"0\"/value: \"${{ github.event.number }}\"/" \
              | oc apply -f -; then
              echo "::error::Could not create the Oracle migration job ${JOB_NAME} for PR ${{ github.event.number }}."
              exit 1
            fi

            # The job downloads the branch archive from GitHub before running
            # Flyway, so allow more time than a pure in-cluster run would need.
            deadline=$(( $(date +%s) + 900 ))
            succeeded=0
            failed=0
            while [ "$(date +%s)" -lt "${deadline}" ]; do
              counts=$(oc get job "${JOB_NAME}" -n cffaf3-tools \
                -o jsonpath='{.status.succeeded}/{.status.failed}' 2>/dev/null || true)
              succeeded="${counts%%/*}"
              failed="${counts##*/}"
              succeeded="${succeeded:-0}"
              failed="${failed:-0}"
              if [ "${succeeded}" -ge 1 ] || [ "${failed}" -ge 1 ]; then
                break
              fi
              echo "Waiting for job ${JOB_NAME} to finish (succeeded=${succeeded}, failed=${failed})..."
              sleep 10
            done

            echo "--- job logs ---"
            oc logs "job/${JOB_NAME}" -n cffaf3-tools --tail=200 || true
            if [ "${succeeded}" -lt 1 ]; then
              echo "--- job description ---"
              oc describe "job/${JOB_NAME}" -n cffaf3-tools || true
              echo "::error::The Oracle migration failed for PR ${{ github.event.number }} (succeeded=${succeeded}, failed=${failed})."
              exit 1
            fi
  deploy-minio:
    name: Deploy MinIO
    needs: [pre-tools]
    runs-on: ubuntu-26.04
    steps:
      - name: Require MinIO credentials
        env:
          MINIO_ROOT_USER: ${{ secrets.MINIO_ROOT_USER }}
          MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
        run: |
          # Fail closed: the template has no credential defaults, so a missing
          # repository secret must stop the deploy rather than create a MinIO
          # instance with empty (or shared) credentials.
          : "${MINIO_ROOT_USER:?MINIO_ROOT_USER repository secret is required}"
          : "${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD repository secret is required}"

      - name: Remove the existing MinIO presign CronJob
        uses: bcgov/action-oc-runner@111868d1fc50db0a40417ba321d865ef5c931bbd # v1.7.0
        with:
          oc_namespace: cffaf3-tools
          oc_server: ${{ secrets.oc_server }}
          oc_token: ${{ secrets.oc_token_tools }}
          commands: |
            # The MinIO server is deployed only when it is missing, so the
            # existing Deployment, Service, PVC and Secret are left alone. The
            # presign CronJob is the exception: its pod template has to match
            # the current branch, so it is removed and recreated.
            oc delete cronjob/nr-waste-plus-tools-minio-presign --ignore-not-found
      - name: Initializing MinIO Deployment
        uses: bcgov/action-deployer-openshift@e2d60eb9cacceb89c3b97d8dcf0a2c460eea5eab # v4.2.3
        env:
          MINIO_ROOT_USER: ${{ secrets.MINIO_ROOT_USER }}
          MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
        with:
          file: tools/minio.deploy.yml
          oc_namespace: cffaf3-tools
          oc_server: ${{ secrets.oc_server }}
          oc_token: ${{ secrets.oc_token_tools }}
          oc_version: "4.13"
          overwrite: false
          parameters:
            -p ZONE=tools
            -p MINIO_ROOT_USER="$MINIO_ROOT_USER"
            -p MINIO_ROOT_PASSWORD="$MINIO_ROOT_PASSWORD"
            -p OBJECT_STORAGE_BUCKET=${{ secrets.OBJECT_STORAGE_BUCKET || 'nr-waste' }}
            -p OBJECT_STORAGE_REGION=${{ secrets.OBJECT_STORAGE_REGION || 'ca-central-1' }}

      - name: Remove the PR MinIO bucket
        continue-on-error: true
        uses: bcgov/action-oc-runner@111868d1fc50db0a40417ba321d865ef5c931bbd # v1.7.0
        env:
          OBJECT_STORAGE_BUCKET: ${{ secrets.OBJECT_STORAGE_BUCKET || 'nr-waste' }}-pr-${{ github.event.number }}
        with:
          oc_namespace: cffaf3-tools
          oc_token: ${{ secrets.oc_token_tools }}
          oc_server: ${{ secrets.oc_server }}
          commands: |
            # Remove only this PR's bucket. The shared MinIO server and the
            # base bucket are left intact for other open PRs.
            POD_NAME=$(oc get pods -l app=nr-waste-plus-tools -l deployment=nr-waste-plus-tools-minio -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
            if [ -z "$POD_NAME" ]; then
              echo "MinIO pod not found; nothing to clean up."
              exit 0
            fi

            oc exec "$POD_NAME" -c minio-init -- sh -c '
              mc --config-dir /tmp/.mc alias set local http://localhost:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" >/dev/null 2>&1 || exit 0
              mc --config-dir /tmp/.mc rm --recursive --force local/"$1" >/dev/null 2>&1 || true
              mc --config-dir /tmp/.mc rb --force local/"$1" >/dev/null 2>&1 || true
            ' _ "$OBJECT_STORAGE_BUCKET"
            echo "Removed bucket $OBJECT_STORAGE_BUCKET (if it existed)."

      # The OpenShift API intermittently refuses or times out connections from
      # GitHub-hosted runners. The oc-runner action logs in and then verifies
      # the namespace without a retry, so a single refused connection fails the
      # step even when the deployment is healthy. This step owns the oc client
      # instead: every call is retried with backoff, and a failed read while
      # polling is treated as "not finished yet" rather than as a failure.
      #
      # The check itself still runs in-cluster, from a one-off Job created from
      # the presign CronJob template, so the request uses the same service DNS
      # name and network path the backend signs for. The Job creates the
      # per-PR bucket when it is missing, so a separate bucket-seeding step
      # would only repeat that work.
      - name: Restore OpenShift CLI
        uses: actions/cache@v6
        with:
          path: /usr/local/bin/oc
          key: oc-cli-stable-4.18-${{ runner.os }}-${{ runner.arch }}

      - name: Seed MinIO bucket and verify presigned PUT and GET
        env:
          OC_SERVER: ${{ secrets.oc_server }}
          OC_TOKEN: ${{ secrets.oc_token_tools }}
          OC_NAMESPACE: cffaf3-tools
          PR_NUMBER: ${{ github.event.number }}
          OC_CLI_VERSION: "4.18"
        run: |
          set -uo pipefail

          # Every oc call carries a request timeout. The API endpoint
          # occasionally drops connections, and without a timeout the client
          # waits on the socket forever instead of failing over to the retry
          # and poll logic below.
          OC="oc --request-timeout=15s"

          if ! command -v oc >/dev/null 2>&1; then
            URL="https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable-${OC_CLI_VERSION}/openshift-client-linux.tar.gz"
            echo "Downloading OpenShift CLI from ${URL}..."
            wget --timeout=15 --tries=3 "${URL}" -qO oc.tar.gz || {
              echo "::error::Failed to download the OpenShift CLI."
              exit 1
            }
            tar -xzf oc.tar.gz oc || {
              rm -f oc.tar.gz
              echo "::error::Failed to extract the OpenShift CLI."
              exit 1
            }
            rm -f oc.tar.gz
            sudo mv oc /usr/local/bin/oc
          fi

          # Retry a command until it succeeds or the attempt budget is spent.
          retry() {
            local attempts="$1"; shift
            local attempt=1
            until "$@"; do
              if [ "${attempt}" -ge "${attempts}" ]; then
                echo "::error::Command failed after ${attempts} attempt(s): $*"
                return 1
              fi
              echo "Attempt ${attempt}/${attempts} failed; retrying in $((attempt * 5))s..."
              sleep $((attempt * 5))
              attempt=$((attempt + 1))
            done
          }

          JOB_TEMPLATE="nr-waste-plus-tools-minio-presign"
          JOB_NAME="minio-presign-pr${PR_NUMBER}-${{ github.run_attempt }}-$(date +%s)"

          login() {
            ${OC} login --server="${OC_SERVER}" --token="${OC_TOKEN}"
          }

          create_job() {
            local rendered patched
            rendered=$(${OC} create job --from="cronjob/${JOB_TEMPLATE}" "${JOB_NAME}" -n "${OC_NAMESPACE}" --dry-run=client -o yaml) || return 1
            patched=$(echo "${rendered}" | sed "/name: PR_NUMBER/{n;s/value: \"0\"/value: \"${PR_NUMBER}\"/;}")
            echo "${patched}" | grep -q "value: \"${PR_NUMBER}\"" || {
              echo "::error::PR_NUMBER was not patched into the ${JOB_NAME} job template."
              return 1
            }
            echo "${patched}" | ${OC} apply -f -
          }

          echo "Logging in to ${OC_SERVER}..."
          retry 5 login || exit 1

          echo "Creating in-cluster verification job ${JOB_NAME}..."
          retry 3 create_job || exit 1

          deadline=$(( $(date +%s) + 300 ))
          succeeded=0
          failed=0
          while [ "$(date +%s)" -lt "${deadline}" ]; do
            counts=$(${OC} get job "${JOB_NAME}" -n "${OC_NAMESPACE}" \
              -o jsonpath='{.status.succeeded}/{.status.failed}' 2>/dev/null || true)
            succeeded="${counts%%/*}"
            failed="${counts##*/}"
            succeeded="${succeeded:-0}"
            failed="${failed:-0}"
            if [ "${succeeded}" -ge 1 ]; then
              break
            fi
            if [ "${failed}" -ge 1 ]; then
              break
            fi
            echo "Waiting for job ${JOB_NAME} to finish (succeeded=${succeeded}, failed=${failed})..."
            sleep 10
          done

          # A dropped connection can cost the poll a status read, so read it
          # once more before deciding the verification failed.
          if [ "${succeeded}" -lt 1 ]; then
            counts=$(${OC} get job "${JOB_NAME}" -n "${OC_NAMESPACE}" -o jsonpath='{.status.succeeded}' 2>/dev/null || true)
            succeeded="${succeeded:-0}"
          fi

          echo "--- job logs ---"
          ${OC} logs "job/${JOB_NAME}" -n "${OC_NAMESPACE}" --tail=100 || true
          if [ "${succeeded}" -lt 1 ]; then
            echo "--- job description ---"
            ${OC} describe "job/${JOB_NAME}" -n "${OC_NAMESPACE}" || true
          fi
          ${OC} delete "job/${JOB_NAME}" -n "${OC_NAMESPACE}" --ignore-not-found || true

          if [ "${succeeded}" -lt 1 ]; then
            echo "::error::Presigned PUT and GET verification failed for PR ${PR_NUMBER} (succeeded=${succeeded}, failed=${failed})."
            exit 1
          fi

          echo "Presigned PUT and GET verified for PR ${PR_NUMBER}."

  scale-up-legacy:
    name: Scale up legacy
    needs: [deploy-postgres, deploy-oracle, deploy-minio]
    runs-on: ubuntu-26.04
    steps:
      # No continue-on-error and no if: always(). A failed database or object
      # storage path skips this job, which keeps the run red, instead of
      # restarting an application against a database that was never prepared.
      - name: Start the Legacy Service
        uses: bcgov/action-oc-runner@111868d1fc50db0a40417ba321d865ef5c931bbd # v1.7.0
        with:
          oc_namespace: ${{ secrets.oc_namespace }}
          oc_token: ${{ secrets.oc_token }}
          oc_server: ${{ secrets.oc_server }}
          commands: |
            set -uo pipefail

            NS="${{ secrets.OC_NAMESPACE }}"
            LEGACY="nr-waste-plus-${{ github.event.number }}-legacy"

            # The PR application is deployed by the PR Open workflow. It may not
            # exist yet on the first push, and that workflow starts it itself,
            # so a missing deployment is not an error here.
            if ! oc get "deployment/${LEGACY}" -n "${NS}" >/dev/null 2>&1; then
              echo "Deployment ${LEGACY} does not exist yet; the PR workflow will start it."
              exit 0
            fi

            oc scale "deployment/${LEGACY}" --replicas=1 -n "${NS}"
