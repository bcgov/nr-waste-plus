name: .Deploys

on:
  workflow_call:
    inputs:
      ### Required
      # Nothing! Only `secrets: inherit` is required

      ### Typical / recommended
      configmap-backend:
        description: Configuration map for application.yml
        required: true
        type: string
      configmap-frontend:
        description: Configuration map for params.js
        required: true
        type: string
        default: ""
      environment:
        description: GitHub/OpenShift environment; usually PR number, test or prod
        default: ""
        type: string
      zone:
        description: Cognito environment; dev, test or prod
        default: "dev"
        type: string
      oracledb-port:
        description: Oracle database port
        default: "1543"
        type: string
      oracledb-servicename:
        description: Oracle service name
        required: false
        type: string
      oracledb-username:
        description: Oracle username
        required: false
        type: string
      postgres-database:
        description: PostgreSQL database the backend connects to; PR callers pass wasteplus_pr_<PR>, shared zones use an environment secret
        required: false
        type: string
      target:
        description: Deployment target; usually PR number, test or prod
        default: ${{ github.event.number }}
        required: false
        type: string
      url:
        description: Frontend URL; omit for PRs
        default: ${{ github.event.repository.name }}-$((${{ github.event.number }} % 50))-frontend.apps.silver.devops.gov.bc.ca
        required: false
        type: string
      object-storage-endpoint:
        description: Object storage / MinIO endpoint
        required: false
        type: string
        default: ""
      object-storage-presigner-endpoint:
        description: Object storage / MinIO client-facing presigner endpoint
        required: false
        type: string
        default: ""
      object-storage-access-key:
        description: Object storage access key
        required: false
        type: string
        default: ""
      object-storage-secret-key:
        description: Object storage secret key
        required: false
        type: string
        default: ""
      object-storage-bucket:
        description: Object storage bucket
        required: false
        type: string
        default: ""
      object-storage-force-path-style:
        description: Force path style for S3 requests
        required: false
        type: string
        default: ""

permissions: {}

jobs:
  vars:
    name: Variables
    runs-on: ubuntu-26.04
    outputs:
      tag: ${{ steps.pr.outputs.pr }}
    steps:
      # Get PR number for squash merges to main
      - name: PR Number
        id: pr
        uses: bcgov/action-get-pr@28b0adf8e4d40720d41f9c87356ce24b0a4bd6af # v0.3.1

  init:
    name: Deploy (init)
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-26.04
    steps:
      - name: Require object storage credentials
        env:
          # The endpoint comes from the workflow input, or from the secret of
          # the target environment (test and prod).
          OBJECT_STORAGE_ENDPOINT: ${{ inputs.object-storage-endpoint || secrets.OBJECT_STORAGE_ENDPOINT }}
          OBJECT_STORAGE_ACCESS_KEY: ${{ inputs.object-storage-access-key || secrets.OBJECT_STORAGE_ACCESS_KEY }}
          OBJECT_STORAGE_SECRET_KEY: ${{ inputs.object-storage-secret-key || secrets.OBJECT_STORAGE_SECRET_KEY }}
          OBJECT_STORAGE_BUCKET: ${{ inputs.object-storage-bucket || secrets.OBJECT_STORAGE_BUCKET }}
          MINIO_ROOT_USER: ${{ secrets.MINIO_ROOT_USER }}
          MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
        run: |
          # Fail closed: this deployment signs against the resolved endpoint,
          # so the matching credentials must be configured.
          if [[ "${OBJECT_STORAGE_ENDPOINT}" == *"nr-waste-plus-tools-minio"* ]]; then
            # The shared tools MinIO serves the PR and dev namespaces.
            : "${MINIO_ROOT_USER:?MINIO_ROOT_USER secret is required for the MinIO endpoint}"
            : "${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD secret is required for the MinIO endpoint}"
            : "${OBJECT_STORAGE_BUCKET:?OBJECT_STORAGE_BUCKET is required for the MinIO endpoint}"
          else
            # Test and prod point at the BC Gov object store.
            : "${OBJECT_STORAGE_ENDPOINT:?OBJECT_STORAGE_ENDPOINT secret is required}"
            [[ "${OBJECT_STORAGE_ENDPOINT}" =~ ^https?:// ]] || { echo "::error::OBJECT_STORAGE_ENDPOINT must be an http(s) URL"; exit 1; }
            : "${OBJECT_STORAGE_ACCESS_KEY:?OBJECT_STORAGE_ACCESS_KEY secret is required for the object store}"
            : "${OBJECT_STORAGE_SECRET_KEY:?OBJECT_STORAGE_SECRET_KEY secret is required for the object store}"
            : "${OBJECT_STORAGE_BUCKET:?OBJECT_STORAGE_BUCKET secret is required for the object store}"
          fi

      - name: Deployment Init
        uses: bcgov/action-deployer-openshift@e2d60eb9cacceb89c3b97d8dcf0a2c460eea5eab # v4.2.3
        env:
          # PR deployments point at the in-cluster MinIO service and use its
          # root credentials. Other endpoints keep using the S3 secrets of the
          # target environment.
          OBJECT_STORAGE_ACCESS_KEY: ${{ inputs.object-storage-access-key || (contains(inputs.object-storage-endpoint || secrets.OBJECT_STORAGE_ENDPOINT, 'nr-waste-plus-tools-minio') && secrets.MINIO_ROOT_USER) || secrets.OBJECT_STORAGE_ACCESS_KEY }}
          OBJECT_STORAGE_SECRET_KEY: ${{ inputs.object-storage-secret-key || (contains(inputs.object-storage-endpoint || secrets.OBJECT_STORAGE_ENDPOINT, 'nr-waste-plus-tools-minio') && secrets.MINIO_ROOT_PASSWORD) || secrets.OBJECT_STORAGE_SECRET_KEY }}
        with:
          file: common/openshift.init.yml
          oc_namespace: ${{ secrets.OC_NAMESPACE }}
          oc_server: ${{ secrets.oc_server }}
          oc_token: ${{ secrets.oc_token }}
          overwrite: true
          parameters: -p ZONE=${{ inputs.zone }}
            -p ORACLEDB_USER=${{ inputs.oracledb-username || secrets.ORACLEDB_USERNAME }}
            -p ORACLEDB_PASSWORD=${{ secrets.ORACLEDB_PASSWORD }}
            -p ORACLEDB_DATABASE=${{ secrets.ORACLEDB_DATABASE }}
            -p ORACLEDB_HOST=${{ secrets.ORACLEDB_HOST }}
            -p ORACLEDB_SERVICENAME=${{ inputs.oracledb-servicename || secrets.ORACLEDB_SERVICENAME }}
            -p ORACLEDB_SECRET=${{ secrets.ORACLEDB_SECRET }}
            -p COGNITO_CLIENT_ID=${{ secrets.COGNITO_CLIENT_ID }}
            -p COGNITO_ENVIRONMENT=${{ inputs.target || 'dev' }}
            -p COGNITO_USER_POOL=${{ secrets.COGNITO_USER_POOL }}
            -p VITE_NODE_ENV=openshift-${{ inputs.target }}
            -p URL_FRONTEND=${{ inputs.url }}
            -p LANDING_URL=${{ inputs.url }}
            -p DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            -p POSTGRES_HOST=${{ secrets.POSTGRES_HOST }}
            -p POSTGRES_PORT=${{ secrets.POSTGRES_PORT }}
            -p POSTGRES_DATABASE=${{ inputs.postgres-database || secrets.POSTGRES_DATABASE }}
            -p POSTGRES_USER=${{ secrets.POSTGRES_USERNAME }}
            -p SPRING_PROFILES_ACTIVE=${{ secrets.OC_NAMESPACE }}
            -p VITE_ZONE=${{ inputs.zone || 'dev' }}
            -p VITE_LEGACY_BASE_URL=${{ secrets.GREEN_DOMAIN }}
            -p CLIENT_BASE_URL=${{ secrets.CLIENT_API_URL }}
            -p CLIENT_BASE_KEY=${{ secrets.CLIENT_API_KEY }}
            -p VITE_CLIENT_BASE_URL=${{ secrets.CLIENT_APP_URL }}
            -p VITE_FAM_DOMAIN=${{ secrets.FAM_DOMAIN }}
            -p VITE_BCEID_HELP=${{ secrets.VITE_BCEID_HELP }}
            -p VITE_IDIR_HELP=${{ secrets.VITE_IDIR_HELP }}
            -p OBJECT_STORAGE_ENDPOINT=${{ inputs.object-storage-endpoint || secrets.OBJECT_STORAGE_ENDPOINT }}
            -p OBJECT_STORAGE_PRESIGNER_ENDPOINT=${{ inputs.object-storage-presigner-endpoint || secrets.OBJECT_STORAGE_PRESIGNER_ENDPOINT }}
            -p OBJECT_STORAGE_ACCESS_KEY="$OBJECT_STORAGE_ACCESS_KEY"
            -p OBJECT_STORAGE_SECRET_KEY="$OBJECT_STORAGE_SECRET_KEY"
            -p OBJECT_STORAGE_BUCKET=${{ inputs.object-storage-bucket || secrets.OBJECT_STORAGE_BUCKET || 'nr-waste' }}
            -p OBJECT_STORAGE_REGION=${{ secrets.OBJECT_STORAGE_REGION || 'ca-central-1' }}
            -p OBJECT_STORAGE_FORCE_PATH_STYLE=${{ inputs.object-storage-force-path-style || secrets.OBJECT_STORAGE_FORCE_PATH_STYLE || 'false' }}

  deploy:
    name: Deploy
    needs: [init, vars]
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      matrix:
        name: [database, frontend, backend, legacy]
        include:
          - name: database
            overwrite: false
          - name: frontend
            overwrite: true
            parameters: -p URL=${{ inputs.url }}
              -p CONFIG_MAP="${{ inputs.configmap-frontend }}"
          - name: backend
            overwrite: true
            parameters: -p FRONTEND_URL=${{ inputs.url }}
              -p CONFIG_MAP="${{ inputs.configmap-backend }}"
          - name: legacy
            overwrite: true
            parameters: -p ORACLEDB_PORT=${{ inputs.oracledb-port }}
            verification_path: actuator/health
    steps:
      - uses: bcgov/action-deployer-openshift@e2d60eb9cacceb89c3b97d8dcf0a2c460eea5eab # v4.2.3
        id: deploys
        with:
          file: ${{ matrix.name }}/openshift.deploy.yml
          oc_namespace: ${{ secrets.oc_namespace }}
          oc_server: ${{ secrets.oc_server }}
          oc_token: ${{ secrets.oc_token }}
          overwrite: ${{ matrix.overwrite }}
          parameters: -p TAG=${{ needs.vars.outputs.tag }}
            -p ZONE=${{ inputs.zone }}
            ${{ matrix.parameters }}
