name: Scheduled

on:
  schedule: [cron: "0 11 * * 6"] # 3 AM PST = 12 PM UDT, Saturdays
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  # https://github.com/bcgov/quickstart-openshift-helpers
  schema-spy:
    name: SchemaSpy Documentation
    permissions:
      contents: write
    uses: bcgov/quickstart-openshift-helpers/.github/workflows/.schema-spy.yml@a11ad3d1b9288fb40757c4314a62eb86ff227931 # v1.2.1
    with:
      flyway_locations: 'filesystem:./backend/src/main/resources/db/migration'
      flyway_schema: 'hrs'
      schemaspy_schema: 'hrs'
    
  zap_scan:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    name: ZAP Baseline (${{ matrix.name }})
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        name: [backend, frontend]
        include:
          - name: backend
            target: https://nr-waste-plus-test-backend.apps.silver.devops.gov.bc.ca
          - name: frontend
            target: https://nr-waste-plus-test-frontend.apps.silver.devops.gov.bc.ca
    steps:
      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          artifact_name: "zap-${{ matrix.name }}"
          allow_issue_writing: false
          target: ${{ matrix.target }}
