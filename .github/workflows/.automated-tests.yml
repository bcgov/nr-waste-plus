name: Automated user flow tests

on:
  workflow_call:
    inputs:
      url:
        required: true
        type: string

jobs:
  playwright-run:
    name: "User flow test"
    # One shared IDIR account: Entra rejects a TOTP code reused inside its
    # window, so concurrent PR runs queue instead of racing (D-018).
    concurrency:
      group: idir-account
      cancel-in-progress: false
    permissions:
      pull-requests: write
    runs-on: ubuntu-26.04
    environment: tools
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        name: Start node
        with:
          node-version: 26

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('user-journeys/package-lock.json') }}
          restore-keys: |
            ms-playwright-${{ runner.os }}-${{ runner.arch }}-

      - name: Install user-journeys dependencies
        working-directory: user-journeys
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Playwright Chromium
        working-directory: user-journeys
        run: npx playwright install --with-deps chromium

      - name: Lint user journeys
        working-directory: user-journeys
        run: npm run lint

      - name: Typecheck user journeys
        working-directory: user-journeys
        run: npm run pw:typecheck

      - name: Reporter unit tests
        working-directory: user-journeys
        run: npm run test:reporters

      - name: Wait for frontend deployment
        env:
          FRONTEND_URL: https://${{ inputs.url }}
        run: |
          set -euo pipefail

          max_attempts=30
          for attempt in $(seq 1 "${max_attempts}"); do
            if response=$(curl --fail --silent --show-error --location --max-time 10 "$FRONTEND_URL/"); then
              if [[ "$response" == *'id="root"'* ]]; then
                echo "Frontend is ready on attempt ${attempt}."
                exit 0
              fi
                echo "Frontend responded without the application root on attempt ${attempt}."
            else
              echo "Frontend readiness check failed on attempt ${attempt}."
            fi
            sleep 10
          done

          echo "Frontend did not become ready after ${max_attempts} attempts: ${FRONTEND_URL}"
          exit 1

      - name: Verify Cypress credentials configured
        env:
          IDIR_USERNAME: ${{ secrets.IDIR_CSS_USERNAME }}
          IDIR_PASSWORD: ${{ secrets.IDIR_CSS_PASSWORD }}
          BCEID_USERNAME: ${{ secrets.BCEID_UAT_USERNAME2 }}
          BCEID_PASSWORD: ${{ secrets.BCEID_UAT_PASSWORD2 }}
        run: |
          set -euo pipefail

          for credential in IDIR_USERNAME IDIR_PASSWORD BCEID_USERNAME BCEID_PASSWORD; do
            if [ -n "${!credential:-}" ]; then
              echo "${credential}: present"
            else
              echo "${credential}: missing"
              exit 1
            fi
          done

      - name: Run Playwright user journeys
        working-directory: user-journeys
        env:
          CYPRESS_baseUrl: https://${{ inputs.url }}
          CI: "true"
          PW_MIN_LOAD_INTERVAL_MS: "1000"
          idir_username: ${{ secrets.IDIR_CSS_USERNAME }}
          idir_password: ${{ secrets.IDIR_CSS_PASSWORD }}
          idir_totp_secret: ${{ secrets.IDIR_CSS_TOTP_SECRET }}
          bceid_username: ${{ secrets.BCEID_UAT_USERNAME2 }}
          bceid_password: ${{ secrets.BCEID_UAT_PASSWORD2 }}
        run: npx bddgen && npx playwright test

      - name: Scan artifacts for leaked secrets
        if: always()
        working-directory: user-journeys
        env:
          SCAN_IDIR_USERNAME: ${{ secrets.IDIR_CSS_USERNAME }}
          SCAN_IDIR_PASSWORD: ${{ secrets.IDIR_CSS_PASSWORD }}
          SCAN_IDIR_TOTP_SECRET: ${{ secrets.IDIR_CSS_TOTP_SECRET }}
          SCAN_BCEID_USERNAME: ${{ secrets.BCEID_UAT_USERNAME2 }}
          SCAN_BCEID_PASSWORD: ${{ secrets.BCEID_UAT_PASSWORD2 }}
        run: |
          set -euo pipefail

          dirs=(playwright-report test-results reports)
          leaked=0

          # Values stay in shell variables; only the variable name is echoed.
          for name in SCAN_IDIR_USERNAME SCAN_IDIR_PASSWORD SCAN_IDIR_TOTP_SECRET SCAN_BCEID_USERNAME SCAN_BCEID_PASSWORD; do
            value="${!name:-}"
            [ -n "$value" ] || continue
            if grep -rFq -- "$value" "${dirs[@]}" 2>/dev/null; then
              echo "::error::A credential value (${name}) was found in the test artifacts."
              leaked=1
            fi
          done

          if grep -rEq -- 'eyJ[A-Za-z0-9_-]{10,}\.' "${dirs[@]}" 2>/dev/null; then
            echo "::error::A JWT-shaped token was found in the test artifacts."
            leaked=1
          fi

          if [ "$leaked" -ne 0 ]; then
            exit 1
          fi
          echo "Artifact secret scan passed."

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            user-journeys/playwright-report
            user-journeys/reports/playwright/timeline.html
            user-journeys/reports/playwright/junit.xml
          retention-days: 7
          if-no-files-found: warn
