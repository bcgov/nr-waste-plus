name: Reusable Backend Tests and Analysis

on:
  workflow_call:

permissions: {}

jobs:
  tests-java:
    name: Backend Tests
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    permissions:
      pull-requests: write
    runs-on: ubuntu-26.04
    env:
      NLS_DATE_FORMAT: 'YYYY-MM-DD'
    steps:
      - name: Start MinIO for backend integration tests
        run: |
          MINIO_USER="minio_$(openssl rand -hex 8)"
          MINIO_PASSWORD="$(openssl rand -hex 16)"
          BUCKET="nr-waste-pr-${{ github.event.number || github.run_id }}-${{ github.run_attempt }}"

          docker run -d --name minio \
            -p 9000:9000 -p 9001:9001 \
            -e MINIO_ROOT_USER="$MINIO_USER" \
            -e MINIO_ROOT_PASSWORD="$MINIO_PASSWORD" \
            cgr.dev/chainguard/minio:latest server /data --console-address ":9001"

          # Wait for MinIO readiness and seed the run-isolated bucket
          docker run --rm --network host \
            -e MINIO_ROOT_USER="$MINIO_USER" \
            -e MINIO_ROOT_PASSWORD="$MINIO_PASSWORD" \
            -e BUCKET="$BUCKET" \
            cgr.dev/chainguard/minio:latest /bin/sh -c "
              until mc alias set local http://127.0.0.1:9000 \$MINIO_ROOT_USER \$MINIO_ROOT_PASSWORD; do
                sleep 1
              done
              mc mb --ignore-existing local/\$BUCKET
            "

          echo "OBJECT_STORAGE_ENDPOINT=http://127.0.0.1:9000" >> $GITHUB_ENV
          echo "OBJECT_STORAGE_ACCESS_KEY=$MINIO_USER" >> $GITHUB_ENV
          echo "OBJECT_STORAGE_SECRET_KEY=$MINIO_PASSWORD" >> $GITHUB_ENV
          echo "OBJECT_STORAGE_BUCKET=$BUCKET" >> $GITHUB_ENV
          echo "S3_FORCE_PATH_STYLE=true" >> $GITHUB_ENV

      - uses: bcgov/action-test-and-analyse-java@7c7309721cae054b3e837c723afa4efb4b1a256d # v1.1.0
        name: Backend Coverage
        with:
          commands: |
            mvn -B verify -P all-tests checkstyle:checkstyle -Dcheckstyle.skip=false --file pom.xml
          dir: backend
          java-cache: maven
          java-distribution: temurin
          java-version: "21"
          sonar_args: >
            -Dsonar.organization=bcgov-sonarcloud
            -Dsonar.projectKey=nr-waste-plus-backend
            -Dsonar.coverage.jacoco.xmlReportPaths=target/coverage-reports/merged-test-report/jacoco.xml
            -Dsonar.java.checkstyle.reportPaths=target/checkstyle-result.xml
            -Dsonar.coverage.exclusions=**/src/test/**,**/configuration/**,**/exception/**,**/dto/**,**/entity/**,**/repository/**,**/security/**,**/*$*Builder*,**/BackendApplication*,**/*Constants.*
          sonar_token: ${{ secrets.SONAR_TOKEN_BACKEND }}
          triggers: ('backend/')

      - uses: bcgov/action-test-and-analyse-java@7c7309721cae054b3e837c723afa4efb4b1a256d # v1.1.0
        name: Legacy Coverage
        with:
          commands: |
            mvn -B verify -P all-tests checkstyle:checkstyle -Dcheckstyle.skip=false --file pom.xml
          dir: legacy
          java-cache: maven
          java-distribution: temurin
          java-version: "21"
          sonar_args: >
            -Dsonar.organization=bcgov-sonarcloud
            -Dsonar.projectKey=nr-waste-plus-legacy
            -Dsonar.coverage.jacoco.xmlReportPaths=target/coverage-reports/merged-test-report/jacoco.xml
            -Dsonar.java.checkstyle.reportPaths=target/checkstyle-result.xml
            -Dsonar.coverage.exclusions=**/src/test/**,**/configuration/**,**/exception/**,**/dto/**,**/entity/**,**/repository/**,**/*$*Builder*,**/LegacyApplication*,**/*Constants.*
          sonar_token: ${{ secrets.SONAR_TOKEN_LEGACY }}
          triggers: ('legacy/')

      - name: Checkstyle report
        continue-on-error: true
        uses: jwgmeligmeyling/checkstyle-github-action@master
        with:
          path: (backend|legacy)/**/checkstyle-result.xml
