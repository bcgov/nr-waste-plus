name: Reusable Backend Tests and Analysis

on:
  workflow_call:

permissions: {}

jobs:
  tests-java:
    name: Backend Tests
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    permissions:
      pull-requests: write
    runs-on: ubuntu-26.04
    env:
      NLS_DATE_FORMAT: 'YYYY-MM-DD'
    steps:
      - uses: bcgov/action-test-and-analyse-java@7c7309721cae054b3e837c723afa4efb4b1a256d # v1.1.0
        name: Backend Coverage
        env:
          # Golden contract files (shared/contracts/) are generated by developers
          # locally only — CI always runs in strict compare mode. See
          # shared/contracts/README.md.
          GOLDEN_UPDATE: 'false'
        with:
          commands: |
            mvn -B verify -P all-tests checkstyle:checkstyle -Dcheckstyle.skip=false --file pom.xml
          dir: backend
          java-cache: maven
          java-distribution: temurin
          java-version: "21"
          sonar_args: >
            -Dsonar.organization=bcgov-sonarcloud
            -Dsonar.projectKey=nr-waste-plus-backend
            -Dsonar.coverage.jacoco.xmlReportPaths=target/coverage-reports/merged-test-report/jacoco.xml
            -Dsonar.java.checkstyle.reportPaths=target/checkstyle-result.xml
            -Dsonar.coverage.exclusions=**/src/test/**,**/configuration/**,**/exception/**,**/dto/**,**/entity/**,**/repository/**,**/*$*Builder*,**/BackendApplication*,**/*Constants.*
          sonar_token: ${{ secrets.SONAR_TOKEN_BACKEND }}
          triggers: ('backend/')

      - name: Verify golden contract files untouched
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if ! git diff --exit-code -- shared/contracts; then
            echo "::error::Golden contract files changed during the test run."
            echo "::error::Golden files are generated by developers locally only"
            echo "::error::(GOLDEN_UPDATE=true ./mvnw verify -P all-tests) and must be"
            echo "::error::committed as a reviewed diff — CI never regenerates them."
            exit 1
          fi
          echo "shared/contracts untouched — compare mode verified."

      - uses: bcgov/action-test-and-analyse-java@7c7309721cae054b3e837c723afa4efb4b1a256d # v1.1.0
        name: Legacy Coverage
        with:
          commands: |
            mvn -B verify -P all-tests checkstyle:checkstyle -Dcheckstyle.skip=false --file pom.xml
          dir: legacy
          java-cache: maven
          java-distribution: temurin
          java-version: "21"
          sonar_args: >
            -Dsonar.organization=bcgov-sonarcloud
            -Dsonar.projectKey=nr-waste-plus-legacy
            -Dsonar.coverage.jacoco.xmlReportPaths=target/coverage-reports/merged-test-report/jacoco.xml
            -Dsonar.java.checkstyle.reportPaths=target/checkstyle-result.xml
            -Dsonar.coverage.exclusions=**/src/test/**,**/configuration/**,**/exception/**,**/dto/**,**/entity/**,**/repository/**,**/*$*Builder*,**/LegacyApplication*,**/*Constants.*
          sonar_token: ${{ secrets.SONAR_TOKEN_LEGACY }}
          triggers: ('legacy/')

      - name: Checkstyle report
        continue-on-error: true
        uses: jwgmeligmeyling/checkstyle-github-action@master
        with:
          path: (backend|legacy)/**/checkstyle-result.xml
