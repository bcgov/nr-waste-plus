name: PR Closed

on:
  pull_request:
    types: [closed]

concurrency:
  # PR open and close use the same group, allowing only one at a time
  group: pr-${{ github.event.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  schema-spy-check:
    name: Check Schema Changes
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      schema_changed: ${{ steps.changed-files.outputs.schema_changed }}
    steps:
      - name: Check changed files
        id: changed-files
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          schema_changed=false
          changed_files="$(gh api --paginate "repos/${REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" --jq '.[].filename')"
          while IFS= read -r filename; do
            case "$filename" in
              backend/src/main/resources/db/migration/*)
                schema_changed=true
                break
                ;;
            esac
          done <<< "$changed_files"

          echo "schema_changed=$schema_changed" >> "$GITHUB_OUTPUT"

  schema-spy:
    name: SchemaSpy Documentation
    needs: schema-spy-check
    if: needs.schema-spy-check.outputs.schema_changed == 'true'
    permissions:
      contents: write
      pages: write
    uses: bcgov/quickstart-openshift-helpers/.github/workflows/.schema-spy.yml@a11ad3d1b9288fb40757c4314a62eb86ff227931 # v1.2.1
    with:
      flyway_locations: 'filesystem:./backend/src/main/resources/db/migration'
      flyway_schema: 'hrs'
      schemaspy_schema: 'hrs'

  cleanup:
    name: Cleanup and Images
    uses: bcgov/quickstart-openshift-helpers/.github/workflows/.pr-close.yml@a11ad3d1b9288fb40757c4314a62eb86ff227931 # v1.2.1
    permissions:
      packages: write
    secrets:
      oc_namespace: ${{ secrets.OC_NAMESPACE }}
      oc_token: ${{ secrets.OC_TOKEN }}
    with:
      cleanup: label
      packages: backend database frontend legacy

  remove-tools:
    name: Remove database and user
    secrets: inherit
    uses: ./.github/workflows/.tools-cleanup.yml

  promote-tools:
    name: Promote tools
    permissions:
      packages: write
    runs-on: ubuntu-24.04
    steps:
      - uses: shrink/actions-docker-registry-tag@e6aaef25c595b6e0edd18bf4c7dbfea3abd43299 # v5
        with:
          registry: ghcr.io
          repository: ${{ github.repository }}/legacydb
          target: ${{ github.event.number }}
          tags: latest
