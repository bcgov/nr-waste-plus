name: Analysis

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  schedule:
    - cron: "0 11 * * 0" # 3 AM PST = 12 PM UDT, runs sundays
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  tests-java:
    name: Backend Tests
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    permissions:
      pull-requests: write
    secrets: inherit
    uses: ./.github/workflows/reusable-tests-be.yml

  tests-frontend:
    name: Frontend Unit Tests
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    secrets: inherit
    permissions:
      contents: write
      checks: write
    uses: ./.github/workflows/reusable-tests-fe.yml

  tests-frontend-ex:
    name: Frontend UI Tests
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    secrets: inherit
    permissions:
      contents: write
      checks: write
    uses: ./.github/workflows/reusable-tests-fe-extra.yml

  trivy:
    name: Repository Report
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Run Trivy vulnerability scanner in repo mode
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          format: "sarif"
          output: "trivy-results.sarif"
          ignore-unfixed: true
          scan-type: "fs"
          scanners: "vuln,secret,misconfig"
          severity: "CRITICAL,HIGH"

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: "trivy-results.sarif"

  cve-lite:
    name: CVE Lite Scan (${{ matrix.folder }})
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        folder: [cypress, frontend]
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Run cve-lite-cli SARIF scan (${{ matrix.folder }})
        run: npx --yes cve-lite-cli@1.25.0 "${{ matrix.folder }}" --sarif --check-overrides
      - name: Locate SARIF file
        id: locate
        run: |
          sarif_file=$(ls ${{ github.workspace }}/cve-lite-scan-*.sarif 2>/dev/null | head -1)
          if [ -z "$sarif_file" ]; then
            echo "::error::No SARIF file found in ${{ github.workspace }}"
            exit 1
          fi
          echo "path=$sarif_file" >> $GITHUB_OUTPUT
      - name: Fix SARIF artifact paths to include folder prefix
        run: |
          FILE="${{ steps.locate.outputs.path }}"
          jq --arg folder "${{ matrix.folder }}" '
            # Only prefix URIs that are relative (no scheme like https://)
            def prefix_uri:
              if . == null then .
              elif test("^[a-zA-Z][a-zA-Z0-9+\\-\\.]*:") then .
              else $folder + "/" + .
              end;
            # Fix results: iterate all runs, all results, all locations
            .runs |= map(
              .results |= (if type == "array" then map(
                .locations |= (if type == "array" then map(
                  .physicalLocation.artifactLocation.uri |= prefix_uri
                ) else . end)
              ) else . end)
            ) |
            # Fix artifacts: iterate all runs, all artifacts
            .runs |= map(
              .artifacts |= (if type == "array" then map(
                .location.uri |= prefix_uri
              ) else . end)
            )
          ' "$FILE" > "${FILE}.fixed" && mv "${FILE}.fixed" "$FILE"
      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.locate.outputs.path }}
          category: "cve-lite-${{ matrix.folder }}"

  npm-audit:
    name: npm Audit (${{ matrix.folder }})
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        folder: [cypress, frontend]
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ${{ matrix.folder }}/package-lock.json
      - name: Run npm audit (${{ matrix.folder }})
        working-directory: ${{ matrix.folder }}
        run: npm audit --package-lock-only --audit-level=high

  sbom-node:
    name: Node SBOM (${{ matrix.folder }})
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        folder: [cypress, frontend]
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ${{ matrix.folder }}/package-lock.json
      - name: Install CycloneDX Node generator
        run: npm install --global @cyclonedx/cyclonedx-npm@1.20.0
      - name: Generate CycloneDX SBOM
        working-directory: ${{ matrix.folder }}
        run: cyclonedx-npm --package-lock-only --output-format JSON --output-file "../sbom-${{ matrix.folder }}.json"
      - name: Validate SBOM JSON
        run: |
          node -e "const fs=require('fs'); const p='sbom-${{ matrix.folder }}.json'; let b; try { b=JSON.parse(fs.readFileSync(p,'utf8')); } catch (e) { console.error('Failed to read or parse ' + p + ': ' + e.message); process.exit(1); } if (!b.bomFormat || b.bomFormat !== 'CycloneDX') { console.error(p + ' is not a valid CycloneDX BOM (bomFormat=' + b.bomFormat + ')'); process.exit(1); }"
      - name: Upload Node SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ matrix.folder }}
          path: sbom-${{ matrix.folder }}.json
          if-no-files-found: error
          retention-days: 30

  sbom-java:
    name: Java SBOM
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    needs: [tests-java]
    steps:
      - name: Download backend SBOM
        uses: actions/download-artifact@v8
        with:
          name: sbom-backend
          path: backend/
      - name: Download legacy SBOM
        uses: actions/download-artifact@v8
        with:
          name: sbom-legacy
          path: legacy/
      - name: Validate backend and legacy CycloneDX
        run: |
          test -s backend/bom.json
          test "$(jq -r '.bomFormat' backend/bom.json)" = "CycloneDX"
          test -s legacy/bom.json
          test "$(jq -r '.bomFormat' legacy/bom.json)" = "CycloneDX"

  # ==========================================================================
  # WARNING: This job acts as the required merge gate for this workflow.
  # If you add a new job to this workflow, you MUST add its ID to the 'needs'
  # array below, otherwise its failure or cancellation will not block the PR!
  # ==========================================================================
  results:
    name: Analysis Results
    needs: [tests-java, tests-frontend, tests-frontend-ex, trivy, cve-lite, npm-audit, sbom-node, sbom-java]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Log Job Results Context
        run: |
          echo "=== Upstream Job Statuses ==="
          echo '${{ toJson(needs) }}'

      - name: Evaluate Overall Status
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "❌ Critical Check Failure: At least one required job has failed or was cancelled."
          exit 1

      - name: Success Message
        run: echo "✅ All critical checks passed or were intentionally skipped!"
